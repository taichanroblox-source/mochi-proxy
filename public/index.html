<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mochi-proxy 🍡</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#57483e;background:#faf5ec}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;background:transparent;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid #c98195;outline-offset:2px}.shell{min-height:100vh;display:flex;flex-direction:column}.top{background:#fffaf4;border-bottom:1px solid #e9dccc;padding:12px 16px;box-shadow:0 3px 18px #7b60410b}.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px}.tab{display:flex;align-items:center;gap:12px;background:#eee4d7;padding:9px 12px;border-radius:14px 14px 7px 7px;max-width:220px;min-width:90px}.tab.active{background:#fff;border:1px solid #e6d8c9;border-bottom:0}.tab .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tab .close{font-size:18px}.add{font-size:24px;padding:3px 10px}.toolbar{display:flex;align-items:center;gap:7px}.tool{border-radius:12px;padding:10px;background:#f3e9dd;flex-shrink:0}.tool:hover,.tab:hover{background:#ead9c8}.address{display:flex;flex:1;min-width:0}.address input{width:100%;border:1px solid #e8d7c6;border-radius:14px;padding:11px 15px;background:white;color:#57483e}.progress{height:3px;background:transparent}.progress.loading{background:linear-gradient(90deg,#f4d1db,#b9856e,#f4d1db);background-size:200% 100%;animation:move 1s linear infinite}@keyframes move{to{background-position:-200% 0}}main{flex:1;padding:32px 20px}.home{max-width:780px;margin:10vh auto;text-align:center}.logo{font-size:52px;margin:0}.home h1{font-size:clamp(32px,6vw,50px);margin:8px 0}.sub{color:#917e70}.search{display:flex;margin:32px auto;max-width:650px;gap:8px}.search input{flex:1;min-width:0;padding:17px;border-radius:18px;border:1px solid #e4d4c4;background:#fff}.primary{background:#dca9b8;border-radius:16px;padding:14px 22px;color:#503e41;font-weight:700}.primary:hover{background:#cf96a8}.panel{margin:30px auto;max-width:700px;text-align:left;background:#fffaf5;border:1px solid #eaded0;border-radius:22px;padding:20px}.panel h2{font-size:17px;margin:0 0 15px}.bookmarks{display:flex;flex-wrap:wrap;gap:10px}.bookmark{background:#f5e9e0;padding:10px 14px;border-radius:12px;display:flex;gap:8px;align-items:center}.bookmark button{padding:2px}.viewer{max-width:740px;margin:10vh auto;background:#fffaf5;padding:30px;border:1px solid #e8d8c8;border-radius:22px;text-align:center}.viewer h2{margin-top:0}.muted{color:#907d70;font-size:14px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}@media(max-width:600px){.top{padding:8px}.toolbar{gap:4px}.tool{padding:8px}.home{margin:4vh auto}.search{flex-direction:column}main{padding:16px 12px}.panel{padding:14px}.tab{min-width:75px}.viewer{margin:5vh auto;padding:20px}}
</style><script src="/uv/uv.bundle.js" defer></script><script src="/uv/uv.config.js" defer></script></head><body><div class="shell"><header class="top"><div id="tabs" class="tabs"></div><div class="toolbar"><button class="tool" id="back" title="戻る">←</button><button class="tool" id="forward" title="進む">→</button><button class="tool" id="reload" title="更新">↻</button><button class="tool" id="home" title="ホーム">⌂</button><form class="address" id="addressForm"><input id="address" aria-label="URLまたは検索キーワード" placeholder="URLまたはキーワードを入力" autocomplete="off"></form><button class="tool" id="star" title="お気に入り">☆</button></div></header><div class="progress" id="progress"></div><main id="content"></main></div>
<script>
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let bookmarks=[];try{bookmarks=JSON.parse(localStorage.getItem('mochi-bookmarks')||'[]');if(!Array.isArray(bookmarks))bookmarks=[]}catch{bookmarks=[]}
const save=()=>localStorage.setItem('mochi-bookmarks',JSON.stringify(bookmarks));
let seq=0,tabs=[{id:++seq,url:'',stack:[''],index:0}],active=tabs[0].id;
const current=()=>tabs.find(t=>t.id===active);
function normalize(s){s=s.trim();if(!s)return '';if(/^https?:\/\//i.test(s)){try{return new URL(s).href}catch{return ''}}if(/^(localhost|\d{1,3}(?:\.\d{1,3}){3})(:\d+)?(?:\/|$)/i.test(s))return '';if(/^[^\s.]+\.[^\s]+$/.test(s)){try{return new URL('https://'+s).href}catch{}}return 'https://duckduckgo.com/?q='+encodeURIComponent(s)}
function navigate(raw,replace=false){const url=normalize(raw);if(!url){goHome();return}const t=current();if(!replace){t.stack=t.stack.slice(0,t.index+1);t.stack.push(url);t.index++}else t.stack[t.index]=url;t.url=url;render(true)}
function goHome(){const t=current();t.stack=t.stack.slice(0,t.index+1);t.stack.push('');t.index++;t.url='';render()}
function move(n){const t=current(),i=t.index+n;if(i<0||i>=t.stack.length)return;t.index=i;t.url=t.stack[i];render()}
function addTab(url=''){const t={id:++seq,url,stack:[url],index:0};tabs.push(t);active=t.id;render()}
function closeTab(id){tabs=tabs.filter(t=>t.id!==id);if(!tabs.length)addTab();else{if(active===id)active=tabs[tabs.length-1].id;render()}}
function addBookmark(){const url=current().url;if(!url)return;const i=bookmarks.findIndex(b=>b.url===url);if(i>=0)bookmarks.splice(i,1);else bookmarks.push({url,name:new URL(url).hostname});save();render()}
function render(loading=false){const t=current();$('tabs').innerHTML=tabs.map(x=>'<button class="tab '+(x.id===active?'active':'')+'" data-id="'+x.id+'"><span class="name">'+escapeHtml(x.url?new URL(x.url).hostname:'ホーム')+'</span><span class="close" data-close="'+x.id+'">×</span></button>').join('')+'<button class="add" id="newtab" title="新しいタブ">＋</button>';$('address').value=t.url;$('back').disabled=t.index===0;$('forward').disabled=t.index>=t.stack.length-1;$('star').textContent=bookmarks.some(b=>b.url===t.url)&&t.url?'★':'☆';$('progress').className='progress'+(loading?' loading':'');if(loading)setTimeout(()=>$('progress').className='progress',650);
if(!t.url){$('content').innerHTML='<section class="home"><p class="logo">🍡</p><h1>mochi-proxy</h1><p class="sub">もちのように、やわらかいブラウザ。</p><form class="search" id="searchForm"><input id="searchInput" placeholder="Webを検索、またはURLを入力" aria-label="検索"><button class="primary">検索</button></form><div class="panel"><h2>☆ お気に入り</h2><div class="bookmarks" id="bookmarks"></div></div></section>';renderBookmarks();$('searchForm').onsubmit=e=>{e.preventDefault();navigate($('searchInput').value)};return}
const youtube=isYouTube(t.url);
$('content').innerHTML='<section class="viewer"><h2>'+(youtube?'▶ YouTube':'🍡 サイトを開く')+'</h2><p class="muted">Ultravioletでのサイト表示は通信中継の接続待ちです。公式埋め込みプレイヤーは使用していません。</p><p id="target" class="muted"></p><div class="actions"><button class="primary" id="retry">再読み込み</button><button class="tool" id="openExternal">通常のブラウザで開く ↗</button></div></section>';
$('target').textContent=t.url;
$('retry').onclick=()=>render(true);
$('openExternal').onclick=()=>window.open(t.url,'_blank','noopener,noreferrer')}
function isYouTube(raw){try{const h=new URL(raw).hostname.toLowerCase();return h==='youtube.com'||h==='www.youtube.com'||h==='m.youtube.com'||h==='youtu.be'}catch{return false}}

function renderBookmarks(){const el=$('bookmarks');if(!bookmarks.length){el.innerHTML='<span class="muted">お気に入りはまだありません</span>';return}el.innerHTML=bookmarks.map((b,i)=>'<div class="bookmark"><button data-open="'+i+'">'+escapeHtml(b.name)+'</button><button data-edit="'+i+'" title="名前変更">✎</button><button data-up="'+i+'" title="前へ">↑</button><button data-down="'+i+'" title="次へ">↓</button><button data-remove="'+i+'" title="削除">×</button></div>').join('')}
$('tabs').onclick=e=>{const c=e.target.closest('[data-close]');if(c){closeTab(Number(c.dataset.close));return}if(e.target.closest('#newtab')){addTab();return}const tab=e.target.closest('[data-id]');if(tab){active=Number(tab.dataset.id);render()}};
$('addressForm').onsubmit=e=>{e.preventDefault();navigate($('address').value)};
$('back').onclick=()=>move(-1);$('forward').onclick=()=>move(1);$('reload').onclick=()=>render(true);$('home').onclick=goHome;$('star').onclick=addBookmark;
$('content').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.open!==undefined)navigate(bookmarks[+d.open].url);if(d.remove!==undefined){bookmarks.splice(+d.remove,1);save();render()}if(d.edit!==undefined){const v=prompt('お気に入りの名前',bookmarks[+d.edit].name);if(v&&v.trim()){bookmarks[+d.edit].name=v.trim().slice(0,80);save();render()}}for(const [k,delta] of [['up',-1],['down',1]])if(d[k]!==undefined){const i=+d[k],j=i+delta;if(j>=0&&j<bookmarks.length){[bookmarks[i],bookmarks[j]]=[bookmarks[j],bookmarks[i]];save();render()}}});
render();
</script></body></html>
